# =============================================================================
# AI-ASE 1.3 — Secrets Detection
# =============================================================================
category: "Secrets Detection"
description: "Detect hardcoded secrets, passwords, API keys, tokens, and connection strings"
version: "1.3.0"

rules:
  - id: "VR-01"
    name: "Hardcoded Password"
    action: BLOCK
    file-types: [ALL]
    skip-tests: false
    pattern: |
      (?i)(password|passwd|pwd)\s*[=:]\s*["''][^"']{3,}
    description: "Hardcoded password detected — secrets must come from EPV-AIM or environment variables"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["G-SDLC-5", "G2.1"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "Passwords in source code end up in version control history forever, exposing credentials to anyone with repo access."
    fix-guidance: "Store passwords in a secret manager (EPV-AIM, Vault, or environment variables) and reference them at runtime."
    given-when-then: |
      GIVEN a source file of any type
      WHEN a password/passwd/pwd is assigned a literal string value of 3+ characters
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-02"
    name: "Hardcoded API Key"
    action: BLOCK
    file-types: [ALL]
    skip-tests: false
    pattern: |
      (?i)(api[_-]?key|apikey|api[_-]?secret)\s*[=:]\s*["''][^"']{8,}
    description: "Hardcoded API key detected — use secret management"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["G-SDLC-5", "G2.1"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "API keys in code are trivially extractable and can be used to impersonate your service or rack up charges."
    fix-guidance: "Move API keys to a secret manager or environment variables and never commit them to source control."
    given-when-then: |
      GIVEN a source file of any type
      WHEN an API key/secret is assigned a literal string value of 8+ characters
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-03"
    name: "AWS Access Key"
    action: BLOCK
    file-types: [ALL]
    skip-tests: false
    pattern: |
      AKIA[0-9A-Z]{16}
    description: "AWS access key detected — never commit credentials"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["G-SDLC-5"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "AWS access keys grant programmatic access to cloud resources; leaked keys are exploited within minutes by automated scanners."
    fix-guidance: "Use IAM roles, instance profiles, or AWS Secrets Manager instead of embedding access keys in code."
    given-when-then: |
      GIVEN a source file of any type
      WHEN the pattern AKIA followed by 16 alphanumeric characters is detected
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-04"
    name: "Bearer Token"
    action: BLOCK
    file-types: [ALL]
    skip-tests: false
    pattern: |
      (?i)(bearer|token)\s*[=:]\s*["''][A-Za-z0-9\-_.]{20,}
    description: "Hardcoded bearer/token detected — use runtime secret retrieval"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["G-SDLC-5"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "Bearer tokens grant authenticated access; hardcoded tokens in code get leaked through repo history or log output."
    fix-guidance: "Retrieve tokens at runtime from a secret manager, OAuth flow, or environment variable."
    given-when-then: |
      GIVEN a source file of any type
      WHEN a bearer/token is assigned a literal string of 20+ characters
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-08"
    name: "Secrets in Dockerfile"
    action: BLOCK
    file-types: [DOCKER]
    skip-tests: false
    pattern: |
      (?i)(ENV|ARG)\s+(PASSWORD|SECRET|API_KEY|TOKEN|CREDENTIAL)\s*=
    description: "Secret in Dockerfile ENV/ARG — use runtime secret injection"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["CTR-4", "G-SDLC-5"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "Dockerfile ENV/ARG values are baked into image layers and visible to anyone who pulls the image."
    fix-guidance: "Use Docker secrets, runtime environment injection, or mount secrets as files instead of baking them into the image."
    given-when-then: |
      GIVEN a Dockerfile
      WHEN an ENV or ARG directive sets a variable named PASSWORD, SECRET, API_KEY, TOKEN, or CREDENTIAL
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-09"
    name: "Hardcoded Connection String"
    action: BLOCK
    file-types: [ALL]
    skip-tests: true
    pattern: |
      (?i)(jdbc:|mongodb(\+srv)?://|redis://|amqp://)\S*(:\S+@)
    description: "Hardcoded connection string with credentials — use environment config"
    version: "1.3.0"
    status: active
    severity: critical
    enforcement: deterministic
    guardrail-ids: ["G2.6", "G-SDLC-5"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "Connection strings with embedded credentials expose database/broker access to anyone reading the source code."
    fix-guidance: "Externalize connection strings to environment variables or a configuration service, with credentials in a secret manager."
    given-when-then: |
      GIVEN a source file of any type (excluding tests)
      WHEN a JDBC, MongoDB, Redis, or AMQP connection string contains embedded credentials
      THEN the scanner MUST block the commit
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"