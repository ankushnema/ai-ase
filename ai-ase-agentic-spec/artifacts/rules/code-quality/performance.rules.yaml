# =============================================================================
# AI-ASE 1.3 — Performance
# =============================================================================
category: "Performance"
description: "Detect thread misuse, blocking calls, and algorithmic complexity issues"
version: "1.3.0"

rules:
  - id: "VR-13"
    name: "Thread.sleep() in Production"
    action: WARN
    file-types: [JAVA]
    skip-tests: true
    pattern: |
      Thread\.sleep\s*\(
    description: "Thread.sleep() in production code — use ScheduledExecutor or async patterns"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["G3.9", "GC-6"]
    profiles: [patch, feature, migration, incident]
    groups: ["code-hygiene"]
    rationale: "Thread.sleep() blocks a thread doing nothing, wasting resources and causing latency spikes under load."
    fix-guidance: "Use ScheduledExecutorService, CompletableFuture.delayedExecutor, or async/reactive patterns instead of Thread.sleep()."
    given-when-then: |
      GIVEN a Java source file (excluding tests)
      WHEN Thread.sleep() is called
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-14"
    name: "new Thread() Direct Creation"
    action: WARN
    file-types: [JAVA]
    skip-tests: true
    pattern: |
      new\s+Thread\s*\(
    description: "Direct thread creation — use ExecutorService thread pool"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["GC-6"]
    profiles: [patch, feature, migration, incident]
    groups: ["code-hygiene"]
    rationale: "Unmanaged threads lack lifecycle control, naming, and bounded concurrency; thread pools provide all three."
    fix-guidance: "Use Executors.newFixedThreadPool() or a managed ExecutorService instead of creating threads directly."
    given-when-then: |
      GIVEN a Java source file (excluding tests)
      WHEN new Thread() is called directly
      THEN the scanner MUST warn the developer
    note: "Duplicate pattern with VR-30 (sre-reliability/resilience). VR-14 covers the code-quality perspective; VR-30 covers the SRE resource-management perspective."
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-22"
    name: "Nested For Loops (O(n^2) Risk)"
    action: WARN
    file-types: [CODE]
    skip-tests: true
    pattern: |
      for\s*\([\s\S]{0,100}for\s*\(
    description: "Nested loops detected — potential O(n^2) complexity. Consider HashSet or stream-based approach"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["GC-1"]
    profiles: [patch, feature, migration, incident]
    groups: ["code-hygiene"]
    rationale: "Nested loops over collections create O(n^2) runtime that becomes a performance bottleneck as data grows."
    fix-guidance: "Use a HashSet for lookups, a Map for grouping, or stream/LINQ operations to avoid nested iteration."
    given-when-then: |
      GIVEN a source code file (excluding tests)
      WHEN two for-loops are nested within close proximity
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-30"
    name: "Direct Thread Creation (Java)"
    action: WARN
    file-types: [JAVA]
    skip-tests: true
    pattern: |
      new\s+Thread\s*\(
    description: "Direct Thread creation — use ExecutorService or virtual threads for managed concurrency"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["SRE-3", "GC-2"]
    profiles: [patch, feature, migration, incident]
    groups: ["sre-core"]
    rationale: "Unmanaged threads are invisible to the container orchestrator and bypass thread-pool sizing, leading to resource exhaustion."
    fix-guidance: "Use ExecutorService, virtual threads (Java 21+), or a managed thread pool instead of new Thread()."
    given-when-then: |
      GIVEN a Java source file (excluding tests)
      WHEN new Thread() is called directly
      THEN the scanner MUST warn the developer
    note: "Duplicate pattern with VR-14 (code-quality/performance). VR-30 covers the SRE resource-management perspective; VR-14 covers the code-quality perspective."
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"