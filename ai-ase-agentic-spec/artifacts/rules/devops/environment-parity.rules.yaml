# =============================================================================
# AI-ASE 1.3 — Environment Parity
# =============================================================================
category: "Environment Parity"
description: "Enforce consistent configurations across dev, staging, and production environments"
version: "1.3.0"

rules:
  - id: "VR-58"
    name: "Open Security Group (0.0.0.0/0)"
    action: WARN
    file-types: [CONFIG]
    skip-tests: false
    pattern: |
      (?i)(cidr_blocks|CidrIp|source_address_prefix)\s*[:=]\s*.*0\.0\.0\.0/0
    description: "Security group open to all IPs (0.0.0.0/0) — restrict to specific CIDR ranges"
    version: "1.3.0"
    status: active
    severity: high
    enforcement: deterministic
    guardrail-ids: ["DO-3"]
    profiles: [patch, feature, migration, incident]
    groups: ["security-critical"]
    rationale: "A security group open to 0.0.0.0/0 allows traffic from any IP on the internet, exposing internal services to attack."
    fix-guidance: "Restrict CIDR blocks to specific IP ranges needed for the service (VPN, corporate network, or specific partners)."
    given-when-then: |
      GIVEN an infrastructure-as-code configuration file
      WHEN a security group rule allows inbound traffic from 0.0.0.0/0
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-59"
    name: "Artifact Tagged as :latest"
    action: WARN
    file-types: [CONFIG]
    skip-tests: false
    pattern: |
      (?i)(image|FROM)\s*[:=]\s*\S+:latest\b
    description: "Artifact/image tagged as :latest — pin to specific version for reproducible deployments"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["DO-4", "SRE-7"]
    profiles: [patch, feature, migration, incident]
    groups: ["devops-essential"]
    rationale: "The :latest tag is mutable and non-deterministic; deployments using it may pull different versions across environments."
    fix-guidance: "Pin images and artifacts to a specific version tag or SHA digest for reproducible deployments."
    given-when-then: |
      GIVEN a configuration file referencing a container image or artifact
      WHEN the reference uses the :latest tag
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-62"
    name: "H2 In-Memory Database in Non-Test"
    action: WARN
    file-types: [CONFIG]
    skip-tests: true
    pattern: |
      (?i)(jdbc:h2:mem|sqlite.*:memory:|DATABASES.*sqlite3)
    description: "In-memory database in non-test config — use the same database engine as production (environment parity)"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["DO-8"]
    profiles: [migration]
    groups: ["devops-essential"]
    rationale: "Using H2/SQLite in-memory databases in non-test environments hides SQL compatibility issues that only appear in production."
    fix-guidance: "Use the same database engine (PostgreSQL, MySQL, etc.) in all environments; use Testcontainers for integration tests."
    given-when-then: |
      GIVEN a configuration file (excluding tests)
      WHEN an in-memory database URL (H2, SQLite :memory:) is configured
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"

  - id: "VR-63"
    name: "Deploy Script Without Monitoring Notification"
    action: WARN
    file-types: [CONFIG]
    skip-tests: false
    pattern: "STRUCTURAL_CHECK"
    checker: "deploy-monitoring-check"
    description: "Deployment pipeline without monitoring event emission — add deployment marker to observability system"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["DO-10"]
    profiles: [patch, feature, migration, incident]
    groups: ["devops-essential"]
    rationale: "Without deployment markers in the monitoring system, correlating performance changes with deployments is impossible."
    fix-guidance: "Add a step to emit a deployment event to your observability platform (Datadog, Grafana, New Relic) on each deploy."
    given-when-then: |
      GIVEN a deployment pipeline configuration
      WHEN no monitoring notification or deployment marker step is present
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"