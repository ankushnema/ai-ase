# =============================================================================
# AI-ASE 1.3 — Supply Chain Security
# =============================================================================
category: "Supply Chain Security"
description: "Ensure dependency lockfiles are committed for reproducible and secure builds"
version: "1.3.0"

rules:
  - id: "VR-61"
    name: "No Lockfile Committed"
    action: WARN
    file-types: [CONFIG]
    skip-tests: false
    pattern: "STRUCTURAL_CHECK"
    checker: "lockfile-check"
    description: "Project without lockfile (package-lock.json, yarn.lock, poetry.lock, pom.xml with versions) — pin dependency versions"
    version: "1.3.0"
    status: active
    severity: medium
    enforcement: deterministic
    guardrail-ids: ["DO-7"]
    profiles: [patch, feature, migration, incident]
    groups: ["devops-essential"]
    rationale: "Without a lockfile, builds pull the latest compatible versions of dependencies, which may include breaking changes or compromised packages."
    fix-guidance: "Commit a lockfile (package-lock.json, yarn.lock, poetry.lock, or Pipfile.lock) and run installs with the frozen/locked flag."
    given-when-then: |
      GIVEN a project with package management
      WHEN no lockfile is present in the repository
      THEN the scanner MUST warn the developer
    changelog:
      - version: "1.3.0"
        date: "2026-05-04"
        change: "Migrated from v1.2 validate-all.ps1"